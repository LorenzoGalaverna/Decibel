name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0), for dry runs without a tag'
        required: true

# No Apple Developer account is used here. The app is ad-hoc signed, so macOS
# shows an "unidentified developer" warning on first launch; the README explains
# how users get past it. Updates are still secured by the Sparkle EdDSA
# signature (SPARKLE_PRIVATE_KEY), which is what Sparkle actually verifies.

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install create-dmg dependencies
        run: brew install graphicsmagick imagemagick

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION (build ${{ github.run_number }})"

      - name: Stamp version into project
        run: |
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = ${VERSION}/g" Decibel.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = ${{ github.run_number }}/g" Decibel.xcodeproj/project.pbxproj

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild build \
            -project Decibel.xcodeproj \
            -scheme Decibel \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

          APP="build/dd/Build/Products/Release/Decibel.app"
          test -d "$APP" || { echo "::error::Decibel.app not found at $APP"; exit 1; }
          mkdir -p build && cp -R "$APP" build/Decibel.app

          # Confirm the ad-hoc signature and inspect the shipped entitlements
          codesign -dv --verbose=2 build/Decibel.app
          codesign -d --entitlements :- build/Decibel.app

          # get-task-allow lets a debugger attach to the shipped app and also
          # makes the build unnotarizable. xcodebuild injects it unless told
          # not to, so fail loudly if it ever comes back.
          if codesign -d --entitlements :- build/Decibel.app 2>/dev/null \
               | grep -q "get-task-allow"; then
            echo "::error::get-task-allow present in a release build"; exit 1
          fi
          echo "entitlement check: no get-task-allow"

      - name: Create DMG
        run: |
          npx --yes create-dmg build/Decibel.app build/ --overwrite || true

          # create-dmg names the file "Decibel <version>.dmg"; normalise it.
          if ls build/*.dmg >/dev/null 2>&1; then
            mv "$(ls build/*.dmg | head -1)" build/Decibel.dmg
          else
            echo "create-dmg produced nothing, falling back to hdiutil"
            rm -rf build/dmg-root
            mkdir -p build/dmg-root
            cp -R build/Decibel.app build/dmg-root/
            ln -s /Applications build/dmg-root/Applications
            hdiutil create -volname Decibel -srcfolder build/dmg-root \
              -ov -format UDZO build/Decibel.dmg
          fi

          test -f build/Decibel.dmg
          echo "DMG: $(du -h build/Decibel.dmg | cut -f1)"

      - name: Sign appcast with Sparkle EdDSA key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set"; exit 1
          fi

          SPARKLE_VERSION="2.8.1"
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle_tools && tar -xf sparkle.tar.xz -C sparkle_tools

          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"

          mkdir -p Release && cp build/Decibel.dmg Release/

          sparkle_tools/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle_key" \
            --download-url-prefix "https://github.com/LorenzoGalaverna/Decibel/releases/download/v${VERSION}/" \
            -o appcast.xml \
            Release/

          rm -f "$RUNNER_TEMP/sparkle_key"
          echo "--- appcast.xml ---"; cat appcast.xml

      - name: Commit updated appcast
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet && echo "appcast unchanged" && exit 0
          git commit -m "Update appcast for v${VERSION}"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Decibel.dmg
          generate_release_notes: true
          body: |
            ## Install

            Download `Decibel.dmg`, open it and drag Decibel to Applications.

            Decibel is not notarized by Apple, so on first launch macOS blocks it
            and says it cannot verify the developer. To allow it:

            1. Open Decibel, then click **Done** on the warning.
            2. Go to **System Settings → Privacy & Security** and scroll to Security.
            3. Click **Open Anyway** next to the Decibel message and confirm.

            On macOS 15 and later, Control-clicking and choosing Open no longer works
            for blocked apps — System Settings is the only route.

            You only need to do this once. Updates after that install with no prompt
            and are cryptographically verified with the project's Sparkle EdDSA key.

      - name: Upload build artifact (dry runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Decibel-dmg
          path: build/Decibel.dmg
